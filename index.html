<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitCpu</title>
  <meta name="description" content="Cuenta tus calorías y macros, arma tu semana y sigue tu progreso.">
  <meta name="theme-color" content="#0a0a09">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitCpu">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
</head>
<body>
  <div id="auth" hidden></div>

  <div id="main" hidden>
    <div id="banner"></div>

    <section id="viewPlan">
      <div class="sticky">
        <header class="top">
          <h1 id="dayTitle">Hoy</h1>
          <div class="top-r">
            <span class="streak" title="Días seguidos registrando"><svg width="20" height="24" viewBox="0 0 20 24" aria-hidden="true"><path d="M10 1c1 4 6 6.5 6 12.5A6 6 0 0 1 4 13.5C4 10 6 9 6.5 6.5 8 8 8.5 9.5 8.5 11 9.5 8 11 5 10 1Z" fill="var(--accent)"/></svg><span id="streak" class="num">0</span></span>
            <button class="iconbtn" id="settingsBtn" aria-label="Ajustes y metas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
          </div>
        </header>
        <div class="week" id="week"></div>
      </div>
      <div class="stack">
        <div id="summary"></div>
        <div class="stack" id="meals"></div>
      </div>
    </section>

    <section id="viewWeek" hidden>
      <header class="top"><h1>Semana</h1></header>
      <div id="weekView"></div>
    </section>

    <section id="viewProg" hidden>
      <header class="top"><h1>Progreso</h1></header>
      <div class="stack" id="prog"></div>
    </section>
  </div>

  <nav class="tabbar" role="tablist" hidden>
    <button role="tab" id="tabPlan" aria-selected="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="4"/><rect x="8" y="8" width="8" height="1.8" rx=".9" fill="var(--card2)"/><rect x="8" y="11.5" width="8" height="1.8" rx=".9" fill="var(--card2)"/><rect x="8" y="15" width="5" height="1.8" rx=".9" fill="var(--card2)"/></svg>Plan</button>
    <button role="tab" id="tabWeek" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"/><rect x="7" y="2.5" width="2.4" height="5" rx="1.2"/><rect x="14.6" y="2.5" width="2.4" height="5" rx="1.2"/><rect x="6.5" y="11" width="3" height="3" rx="1" fill="var(--card2)"/><rect x="10.5" y="11" width="3" height="3" rx="1" fill="var(--card2)"/><rect x="14.5" y="11" width="3" height="3" rx="1" fill="var(--card2)"/><rect x="6.5" y="15.5" width="3" height="3" rx="1" fill="var(--card2)"/><rect x="10.5" y="15.5" width="3" height="3" rx="1" fill="var(--card2)"/></svg>Semana</button>
    <button role="tab" id="tabProg" aria-selected="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="11" width="4" height="10" rx="2"/><rect x="10" y="4" width="4" height="17" rx="2"/><rect x="16" y="8" width="4" height="13" rx="2"/></svg>Progreso</button>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toastRoot"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
